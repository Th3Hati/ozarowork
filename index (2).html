        let currentWeekNumber = 3;

function updateCurrentShift() {
            const now = new Date();
            const daysOfWeek = ['Воскресенье', 'Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота'];
            const currentDay = daysOfWeek[now.getDay()];
            const currentTime = now.getHours() * 60 + now.getMinutes();
            
            const currentWeekKey = `week${currentWeekNumber}`;
            const currentPeople = [];
            
            const prevDayIndex = (now.getDay() - 1 + 7) % 7;
            const prevDay = daysOfWeek[prevDayIndex];
            
            [currentDay, prevDay].forEach(day => {
                if (shifts[currentWeekKey]) {
                    shifts[currentWeekKey].forEach(shift => {
                        if(shift.day === day) {
                            if(shift.start <= shift.end) {
                                if(currentTime >= shift.start && currentTime <= shift.end) {
                                    currentPeople.push(shift.name);
                                }
                            } else {
                                if((day === currentDay && currentTime >= shift.start) ||
                                   (day === prevDay && currentTime < shift.end)) {
                                    currentPeople.push(shift.name);
                                }
                            }
                        }
                    });
                }
            });
            
            const uniquePeople = [...new Set(currentPeople)];
            const statusElement = document.getElementById('current-shift-list');
            statusElement.textContent = uniquePeople.length > 0 
                ? uniquePeople.join(', ') 
                : 'Сейчас никого нет на смене';
        }

        // Модифицированный обработчик переключения недель
        document.querySelectorAll('.week-tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.week-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.week-content').forEach(c => c.classList.remove('active'));
                
                this.classList.add('active');
                const weekNumber = this.dataset.week;
                document.getElementById(`week-${weekNumber}`).classList.add('active');
                
                // Обновляем номер текущей недели и информацию
                currentWeekNumber = parseInt(weekNumber);
                document.getElementById('current-week').textContent = 
                    weekNumber === '1' ? 'I' : weekNumber === '2' ? 'II' : 'III';
                
                // Обновляем список дежурных для выбранной недели
                updateCurrentShift();
            });
        });

        // Отображение расписания для всех недель
        function renderSchedules() {
            for (let week = 1; week <= 3; week++) {
                const weekKey = `week${week}`;
                const weekDiv = document.getElementById(`week-${week}`);
                
                if (scheduleData[weekKey]) {
                    Object.entries(scheduleData[weekKey]).forEach(([day, dayShifts]) => {
                        const daySection = document.createElement('div');
                        daySection.className = 'day-schedule';
                        
                        let shiftsHtml = dayShifts.map(shift => {
                            if (shift === "-" || shift.includes(": -")) {
                                return `<li class="shift-item empty-shift">${shift.includes(":") ? shift : "Нет дежурств"}</li>`;
                            }
                            return `<li class="shift-item">${shift}</li>`;
                        }).join('');
                        
                        daySection.innerHTML = `
                            <div class="day-title">${day}</div>
                            <ul class="shift-list">${shiftsHtml}</ul>
                        `;
                        weekDiv.appendChild(daySection);
                    });
                }
            }
        }

        // Переключение между неделями
        document.querySelectorAll('.week-tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.week-tab').forEach(t => t.classList.remove('active'));

                this.classList.add('active');
                document.getElementById(`week-${this.dataset.week}`).classList.add('active');
            });
        });

        // Инициализация
        renderSchedules();
